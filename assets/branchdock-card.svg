  <rect x="90" y="112" width="67" height="23" rx="11.5" fill="#16232e"/>
  <text x="103" y="128" fill="#39ff14" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600">crates.io</text>
  <text x="385" y="129" text-anchor="end" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12">v0.1.0</text>
</svg>
